[package]
name = "fastfind"
version = "0.3.0"
edition = "2021"
description = "Everything-grade instant file search for Windows: NTFS $MFT indexing, structured filters, and a built-in MCP server for AI agents."
license = "MIT"
repository = "https://github.com/adisingh396/fastfind"
homepage = "https://github.com/adisingh396/fastfind"
readme = "README.md"
keywords = ["search", "filesystem", "ntfs", "mft", "mcp"]
categories = ["command-line-utilities", "filesystem"]
authors = ["Aditya Singh"]

[dependencies]
rayon = "1.10"
regex = "1.11"
rustc-hash = "2.1"
serde_json = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
